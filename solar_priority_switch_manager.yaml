blueprint:
  name: "Solar Priority Switch Manager (Deye/Solarman + Solcast) - Zero Injection"
  description: >
    **Version: 1.1.3**


    Drives up to 4 switches in priority order (1 = highest priority, 4 = lowest)
    based on real solar surplus (Solarman/Deye) cross-checked against the Solcast
    forecast, battery SOC, and Grid presence. Only Device 1 is mandatory; Devices
    2 to 4 are optional (leave the "Switch" field empty to disable a device).

    Design assumptions (adjust if needed):
    - A device with "Minimum runtime" = 0 is considered self-managed: the
      blueprint turns it on but NEVER turns it off automatically, except on
      Grid loss (safety, always bypassed).
    - Stop condition 2.d (approaching the Solcast forecast) is ignored if
      today's production already exceeds today's Solcast forecast (case where
      Solcast underestimated production): in that case only 2.a / 2.b / 2.c /
      2.e are used.
    - Stop conditions 2.a, 2.b, 2.d, 2.e are global (they apply to any running
      device whose minimum runtime has elapsed). Condition 2.c is evaluated
      per device (its own consumption vs 10% -by default- of the battery
      discharge power).
    - The CT1 (External CT1 Power) acts as an extra safety guard: it blocks a
      device from starting if there is already a grid import (2.e on start)
      and triggers the global stop if there is a significant import (2.e on
      stop), independently of the battery state.
    - Only one device is started per evaluation cycle (to let Load power
      settle before re-evaluating the available surplus), but several devices
      can be stopped within the same cycle.
  domain: automation
  author: "Xavier Beaudouin"
  homeassistant:
    min_version: "2024.6.0"

  input:
    inverter_group:
      name: "Inverter / Battery (Solarman - Deye)"
      icon: mdi:battery-charging-high
      input:
        battery_soc_entity:
          name: "Battery SOC (%)"
          selector:
            entity:
              domain: sensor
        battery_power_entity:
          name: "Battery Power (W)"
          description: "Positive = discharge, negative = charge."
          selector:
            entity:
              domain: sensor
        grid_ct_power_entity:
          name: "External CT1 Power (W)"
          description: "Positive = grid consumption, negative = export. Used as an extra safety guard (start and stop)."
          selector:
            entity:
              domain: sensor
        grid_status_entity:
          name: "Grid status"
          description: "binary_sensor indicating the Grid state."
          default: "binary_sensor.bureau_deyes_grid"
          selector:
            entity: {}
        grid_status_ok_value:
          name: "Expected value when Grid is OK"
          description: "State of the entity above considered as 'Grid connected' (usually 'on' for a binary_sensor)."
          default: "on"
          selector:
            text: {}
        pv_power_entity:
          name: "PV Power (W)"
          selector:
            entity:
              domain: sensor
        today_production_entity:
          name: "Today production (kWh)"
          selector:
            entity:
              domain: sensor
        load_power_entity:
          name: "Load power (W)"
          selector:
            entity:
              domain: sensor

    solcast_group:
      name: "Solcast Forecast"
      icon: mdi:weather-sunny
      input:
        solcast_power_now_entity:
          name: "Solcast - Power now (W)"
          selector:
            entity:
              domain: sensor
        solcast_forecast_today_entity:
          name: "Solcast - Forecast today (kWh)"
          selector:
            entity:
              domain: sensor

    thresholds_group:
      name: "Thresholds"
      icon: mdi:tune
      input:
        soc_start_threshold:
          name: "SOC start threshold (%)"
          default: 80
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        soc_stop_threshold:
          name: "SOC absolute stop threshold (%)"
          default: 65
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        battery_discharge_stop_threshold_w:
          name: "Battery discharge hysteresis (condition 2.a) (W)"
          description: "Condition 2.a (battery discharging) only triggers if the discharge power exceeds this threshold, to avoid false positives on small fluctuations."
          default: 50
          selector:
            number:
              min: 0
              max: 2000
              step: 5
              unit_of_measurement: "W"
        grid_import_stop_threshold_w:
          name: "Grid import threshold (CT1 safety guard) (W)"
          description: "Used (a) to prevent a device from starting if the CT1 already shows a grid import above this threshold, and (b) as an extra global stop condition (2.e) if the import exceeds this threshold, independently of SOC/battery."
          default: 50
          selector:
            number:
              min: 0
              max: 2000
              step: 5
              unit_of_measurement: "W"
        battery_discharge_share_threshold:
          name: "Battery discharge share threshold (condition 2.c) (%)"
          description: "A device stops if its consumption exceeds this % of the battery discharge power."
          default: 10
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        solcast_completion_threshold:
          name: "Solcast forecast completion threshold (condition 2.d) (%)"
          default: 95
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    device_1_group:
      name: "Device 1 (priority 1 - highest)"
      icon: mdi:numeric-1-circle
      input:
        device_1_switch:
          name: "Switch"
          selector:
            entity:
              domain: switch
        device_1_power:
          name: "Nominal power (W)"
          default: 1000
          selector:
            number:
              min: 0
              max: 20000
              step: 10
              unit_of_measurement: "W"
        device_1_power_sensor:
          name: "Power sensor (optional)"
          description: "If absent, the nominal power is used."
          default: ""
          selector:
            entity:
              domain: sensor
        device_1_min_runtime:
          name: "Minimum runtime (min)"
          description: "0 = self-managed device, never turned off automatically (except on Grid loss)."
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: "min"

    device_2_group:
      name: "Device 2 (priority 2) - optional"
      icon: mdi:numeric-2-circle
      input:
        device_2_switch:
          name: "Switch (leave empty to disable this device)"
          default: ""
          selector:
            entity:
              domain: switch
        device_2_power:
          name: "Nominal power (W)"
          default: 1000
          selector:
            number:
              min: 0
              max: 20000
              step: 10
              unit_of_measurement: "W"
        device_2_power_sensor:
          name: "Power sensor (optional)"
          default: ""
          selector:
            entity:
              domain: sensor
        device_2_min_runtime:
          name: "Minimum runtime (min)"
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: "min"

    device_3_group:
      name: "Device 3 (priority 3) - optional"
      icon: mdi:numeric-3-circle
      input:
        device_3_switch:
          name: "Switch (leave empty to disable this device)"
          default: ""
          selector:
            entity:
              domain: switch
        device_3_power:
          name: "Nominal power (W)"
          default: 1000
          selector:
            number:
              min: 0
              max: 20000
              step: 10
              unit_of_measurement: "W"
        device_3_power_sensor:
          name: "Power sensor (optional)"
          default: ""
          selector:
            entity:
              domain: sensor
        device_3_min_runtime:
          name: "Minimum runtime (min)"
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: "min"

    device_4_group:
      name: "Device 4 (priority 4 - lowest) - optional"
      icon: mdi:numeric-4-circle
      input:
        device_4_switch:
          name: "Switch (leave empty to disable this device)"
          default: ""
          selector:
            entity:
              domain: switch
        device_4_power:
          name: "Nominal power (W)"
          default: 1000
          selector:
            number:
              min: 0
              max: 20000
              step: 10
              unit_of_measurement: "W"
        device_4_power_sensor:
          name: "Power sensor (optional)"
          default: ""
          selector:
            entity:
              domain: sensor
        device_4_min_runtime:
          name: "Minimum runtime (min)"
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: "min"

mode: single
max_exceeded: silent

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: "tick"
  - platform: state
    entity_id: !input grid_status_entity
    id: "grid_change"
  - platform: state
    entity_id: !input battery_soc_entity
    id: "soc_change"
  - platform: state
    entity_id: !input pv_power_entity
    id: "pv_change"
  - platform: state
    entity_id: !input load_power_entity
    id: "load_change"

condition: []

action:
  - variables:
      # --- raw inputs ---
      battery_soc_entity: !input battery_soc_entity
      battery_power_entity: !input battery_power_entity
      grid_ct_power_entity: !input grid_ct_power_entity
      grid_status_entity: !input grid_status_entity
      grid_status_ok_value: !input grid_status_ok_value
      pv_power_entity: !input pv_power_entity
      today_production_entity: !input today_production_entity
      load_power_entity: !input load_power_entity
      solcast_power_now_entity: !input solcast_power_now_entity
      solcast_forecast_today_entity: !input solcast_forecast_today_entity
      soc_start_threshold: !input soc_start_threshold
      soc_stop_threshold: !input soc_stop_threshold
      battery_discharge_stop_threshold_w: !input battery_discharge_stop_threshold_w
      grid_import_stop_threshold_w: !input grid_import_stop_threshold_w
      battery_discharge_share_threshold: !input battery_discharge_share_threshold
      solcast_completion_threshold: !input solcast_completion_threshold
      device_1_switch: !input device_1_switch
      device_1_power: !input device_1_power
      device_1_power_sensor: !input device_1_power_sensor
      device_1_min_runtime: !input device_1_min_runtime
      device_2_switch: !input device_2_switch
      device_2_power: !input device_2_power
      device_2_power_sensor: !input device_2_power_sensor
      device_2_min_runtime: !input device_2_min_runtime
      device_3_switch: !input device_3_switch
      device_3_power: !input device_3_power
      device_3_power_sensor: !input device_3_power_sensor
      device_3_min_runtime: !input device_3_min_runtime
      device_4_switch: !input device_4_switch
      device_4_power: !input device_4_power
      device_4_power_sensor: !input device_4_power_sensor
      device_4_min_runtime: !input device_4_min_runtime

      # --- live values ---
      battery_soc: "{{ states(battery_soc_entity) | float(0) }}"
      battery_power: "{{ states(battery_power_entity) | float(0) }}"
      grid_ct_power: "{{ states(grid_ct_power_entity) | float(0) }}"
      grid_ok: "{{ states(grid_status_entity) == grid_status_ok_value }}"
      pv_power: "{{ states(pv_power_entity) | float(0) }}"
      today_production: "{{ states(today_production_entity) | float(0) }}"
      load_power: "{{ states(load_power_entity) | float(0) }}"
      solcast_power_now: "{{ states(solcast_power_now_entity) | float(0) }}"
      solcast_forecast_today: "{{ states(solcast_forecast_today_entity) | float(0) }}"

      # effective PV = min(real PV, Solcast instant power) to avoid false starts on transient spikes
      effective_pv_power: >-
        {% if solcast_power_now_entity and states(solcast_power_now_entity) not in ['unknown','unavailable',none] %}
          {{ [pv_power, solcast_power_now] | min }}
        {% else %}
          {{ pv_power }}
        {% endif %}

      surplus_power: "{{ effective_pv_power - load_power }}"

      # --- "end of solar day" detection (2.d), with a guard against Solcast underestimation ---
      solcast_ratio: >-
        {% if solcast_forecast_today > 0 %}
          {{ (today_production / solcast_forecast_today) * 100 }}
        {% else %}
          0
        {% endif %}
      solcast_completion_reached: >-
        {{ solcast_forecast_today > 0
           and today_production < solcast_forecast_today
           and solcast_ratio >= solcast_completion_threshold }}

      # --- CT1 safety guard: significant grid import => no real surplus left, stop (2.e) ---
      grid_importing_unsafe: "{{ grid_ct_power > grid_import_stop_threshold_w }}"

      # --- global stop condition (2.a battery discharging with hysteresis / 2.b low SOC / 2.d end of day / 2.e CT1 import) ---
      global_stop_condition: >-
        {{ (battery_power > battery_discharge_stop_threshold_w)
           or (battery_soc < soc_stop_threshold)
           or solcast_completion_reached
           or grid_importing_unsafe }}

      # --- device 1 ---
      device_1_power_estimate: >-
        {% if device_1_power_sensor and states(device_1_power_sensor) not in ['unknown','unavailable',none] %}
          {{ states(device_1_power_sensor) | float(device_1_power) }}
        {% else %}
          {{ device_1_power }}
        {% endif %}
      device_1_elapsed_min: >-
        {% set st = states[device_1_switch] %}
        {{ ((now() - st.last_changed).total_seconds() / 60) if st else 0 }}
      device_1_self_managed: "{{ device_1_min_runtime | int(0) == 0 }}"
      device_1_min_runtime_elapsed: "{{ device_1_elapsed_min >= device_1_min_runtime }}"
      device_1_battery_share_exceeded: >-
        {{ (battery_power > 0) and (device_1_power_estimate >= (battery_power * (battery_discharge_share_threshold / 100))) }}
      device_1_should_stop: >-
        {{ (not grid_ok) or (not device_1_self_managed and device_1_min_runtime_elapsed
           and (global_stop_condition or device_1_battery_share_exceeded)) }}
      device_1_can_start: >-
        {{ states(device_1_switch) == 'off' and grid_ok
           and battery_soc >= soc_start_threshold
           and surplus_power >= device_1_power
           and grid_ct_power <= grid_import_stop_threshold_w }}

      # --- device 2 (optional) ---
      device_2_configured: "{{ device_2_switch not in [none, ''] }}"
      device_2_power_estimate: >-
        {% if device_2_power_sensor and states(device_2_power_sensor) not in ['unknown','unavailable',none] %}
          {{ states(device_2_power_sensor) | float(device_2_power) }}
        {% else %}
          {{ device_2_power }}
        {% endif %}
      device_2_elapsed_min: >-
        {% if device_2_switch %}
          {% set st = states[device_2_switch] %}
          {{ ((now() - st.last_changed).total_seconds() / 60) if st else 0 }}
        {% else %}
          0
        {% endif %}
      device_2_self_managed: "{{ device_2_min_runtime | int(0) == 0 }}"
      device_2_min_runtime_elapsed: "{{ device_2_elapsed_min >= device_2_min_runtime }}"
      device_2_battery_share_exceeded: >-
        {{ device_2_configured and (battery_power > 0) and (device_2_power_estimate >= (battery_power * (battery_discharge_share_threshold / 100))) }}
      device_2_should_stop: >-
        {{ device_2_configured and ((not grid_ok) or (not device_2_self_managed and device_2_min_runtime_elapsed
           and (global_stop_condition or device_2_battery_share_exceeded))) }}
      device_2_can_start: >-
        {{ device_2_configured and states(device_2_switch) == 'off' and grid_ok
           and battery_soc >= soc_start_threshold
           and surplus_power >= device_2_power
           and grid_ct_power <= grid_import_stop_threshold_w }}

      # --- device 3 (optional) ---
      device_3_configured: "{{ device_3_switch not in [none, ''] }}"
      device_3_power_estimate: >-
        {% if device_3_power_sensor and states(device_3_power_sensor) not in ['unknown','unavailable',none] %}
          {{ states(device_3_power_sensor) | float(device_3_power) }}
        {% else %}
          {{ device_3_power }}
        {% endif %}
      device_3_elapsed_min: >-
        {% if device_3_switch %}
          {% set st = states[device_3_switch] %}
          {{ ((now() - st.last_changed).total_seconds() / 60) if st else 0 }}
        {% else %}
          0
        {% endif %}
      device_3_self_managed: "{{ device_3_min_runtime | int(0) == 0 }}"
      device_3_min_runtime_elapsed: "{{ device_3_elapsed_min >= device_3_min_runtime }}"
      device_3_battery_share_exceeded: >-
        {{ device_3_configured and (battery_power > 0) and (device_3_power_estimate >= (battery_power * (battery_discharge_share_threshold / 100))) }}
      device_3_should_stop: >-
        {{ device_3_configured and ((not grid_ok) or (not device_3_self_managed and device_3_min_runtime_elapsed
           and (global_stop_condition or device_3_battery_share_exceeded))) }}
      device_3_can_start: >-
        {{ device_3_configured and states(device_3_switch) == 'off' and grid_ok
           and battery_soc >= soc_start_threshold
           and surplus_power >= device_3_power
           and grid_ct_power <= grid_import_stop_threshold_w }}

      # --- device 4 (optional) ---
      device_4_configured: "{{ device_4_switch not in [none, ''] }}"
      device_4_power_estimate: >-
        {% if device_4_power_sensor and states(device_4_power_sensor) not in ['unknown','unavailable',none] %}
          {{ states(device_4_power_sensor) | float(device_4_power) }}
        {% else %}
          {{ device_4_power }}
        {% endif %}
      device_4_elapsed_min: >-
        {% if device_4_switch %}
          {% set st = states[device_4_switch] %}
          {{ ((now() - st.last_changed).total_seconds() / 60) if st else 0 }}
        {% else %}
          0
        {% endif %}
      device_4_self_managed: "{{ device_4_min_runtime | int(0) == 0 }}"
      device_4_min_runtime_elapsed: "{{ device_4_elapsed_min >= device_4_min_runtime }}"
      device_4_battery_share_exceeded: >-
        {{ device_4_configured and (battery_power > 0) and (device_4_power_estimate >= (battery_power * (battery_discharge_share_threshold / 100))) }}
      device_4_should_stop: >-
        {{ device_4_configured and ((not grid_ok) or (not device_4_self_managed and device_4_min_runtime_elapsed
           and (global_stop_condition or device_4_battery_share_exceeded))) }}
      device_4_can_start: >-
        {{ device_4_configured and states(device_4_switch) == 'off' and grid_ok
           and battery_soc >= soc_start_threshold
           and surplus_power >= device_4_power
           and grid_ct_power <= grid_import_stop_threshold_w }}

  # --- Stop pass: independent per device, can turn off several within the same cycle ---
  - if:
      - condition: template
        value_template: "{{ device_1_should_stop and is_state(device_1_switch, 'on') }}"
    then:
      - service: switch.turn_off
        target:
          entity_id: "{{ device_1_switch }}"

  - if:
      - condition: template
        value_template: "{{ device_2_should_stop and is_state(device_2_switch, 'on') }}"
    then:
      - service: switch.turn_off
        target:
          entity_id: "{{ device_2_switch }}"

  - if:
      - condition: template
        value_template: "{{ device_3_should_stop and is_state(device_3_switch, 'on') }}"
    then:
      - service: switch.turn_off
        target:
          entity_id: "{{ device_3_switch }}"

  - if:
      - condition: template
        value_template: "{{ device_4_should_stop and is_state(device_4_switch, 'on') }}"
    then:
      - service: switch.turn_off
        target:
          entity_id: "{{ device_4_switch }}"

  # --- Start pass: only one device per cycle, in priority order ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ device_1_can_start }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ device_1_switch }}"
      - conditions:
          - condition: template
            value_template: "{{ device_2_can_start }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ device_2_switch }}"
      - conditions:
          - condition: template
            value_template: "{{ device_3_can_start }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ device_3_switch }}"
      - conditions:
          - condition: template
            value_template: "{{ device_4_can_start }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ device_4_switch }}"
    default: []
